# Complete local deployment. start-dev.ps1 starts only the four infrastructure services.
name: mmrag

x-application: &application
  image: mmrag-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: ["${MMRAG_ENV_FILE:-.env}"]
  environment:
    MYSQL_HOST: mysql57
    MYSQL_PORT: "3306"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    QDRANT_HOST: qdrant
    QDRANT_PORT: "6333"
    RAG_QDRANT_URL: http://qdrant:6333
    RAG_QDRANT_PATH: ""
    MINIO_ENDPOINT: minio:9000
    MINIO_SECURE: "false"
    MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-127.0.0.1:9000}
    APP_BACKEND_URL: http://backend:8001
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:5174}
    APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
    MMRAG_FRONTEND_PORT: ${MMRAG_FRONTEND_PORT:-5174}
  init: true
  stop_grace_period: 120s

services:
  mysql57:
    image: mysql:5.7.44
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-large-prefix=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-multimodal_rag_assistant}
      MYSQL_USER: ${MYSQL_USER:-mmrag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports: ["127.0.0.1:${MYSQL_PORT:-3308}:3306"]
    volumes: ["mysql57-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -uroot --silent -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${REDIS_PORT:-6378}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: openvidu/minio:RELEASE.2026-09-22T19-25-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-mmragadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_BROWSER: "on"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ports: ["127.0.0.1:${MMRAG_MINIO_PORT:-9000}:9000", "127.0.0.1:${MMRAG_MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["minio-data:/bitnami/minio/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.10.0
    ports: ["127.0.0.1:${MMRAG_QDRANT_PORT:-${QDRANT_PORT:-6333}}:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

  bootstrap:
    <<: *application
    command: ["python", "-m", "scripts.dev_setup", "bootstrap", "--wait-seconds", "300"]
    restart: "no"
    depends_on:
      mysql57: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      qdrant: {condition: service_started}

  backend:
    <<: *application
    command: ["python", "-m", "uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1", "--timeout-graceful-shutdown", "110"]
    ports: ["127.0.0.1:${MMRAG_BACKEND_PORT:-8001}:8001"]
    restart: unless-stopped
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.container_health", "api"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 6

  worker:
    <<: *application
    command: ["python", "-m", "celery", "-A", "backend.task.celery_app:celery_app", "worker", "--pool=solo", "--concurrency=1", "--loglevel=INFO", "--hostname", "${CELERY_QUEUE_PREFIX:-mmrag}@%h"]
    restart: unless-stopped
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.container_health", "worker"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 6

  frontend:
    image: mmrag-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:${MMRAG_FRONTEND_PORT:-5174}:80"]
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 20s
      timeout: 5s
      retries: 6

volumes:
  mysql57-data:
    name: ${COMPOSE_PROJECT_NAME:-mmrag}_mysql57
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:-mmrag}_redis
  minio-data:
    name: ${COMPOSE_PROJECT_NAME:-mmrag}_minio
  qdrant-data:
    name: ${COMPOSE_PROJECT_NAME:-mmrag}_qdrant
