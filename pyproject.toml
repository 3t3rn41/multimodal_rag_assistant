[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag-assistant"
version = "0.1.0"
description = "Retrieval and generation components for a multimodal RAG assistant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.10"]
rerank = ["httpx>=0.27"]
rerank-local = ["sentence-transformers>=3.0"]
llm = ["httpx>=0.27"]
api = ["httpx>=0.27"]
documents = ["PyMuPDF>=1.24"]
all = [
  "qdrant-client>=1.10",
  "httpx>=0.27",
  "PyMuPDF>=1.24",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["rag_engine*", "ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
