[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag-assistant"
version = "0.1.0"
description = "Retrieval and generation components for a multimodal RAG assistant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.10"]
rerank = ["httpx>=0.27"]
rerank-local = ["sentence-transformers>=3.0"]
llm = ["httpx>=0.27"]
api = ["httpx>=0.27"]
app = [
  "packaging>=23",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "asyncmy>=0.2.16,<0.3",
  "PyMySQL>=1.1,<2",
  "redis>=5,<8",
  "celery[redis]>=5.4,<6",
  "minio>=7.2,<8",
  "qdrant-client>=1.10,<2",
  "httpx>=0.27,<1",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.18",
  "PyMuPDF>=1.24,<2",
]
documents = ["PyMuPDF>=1.24"]
all = [
  "qdrant-client>=1.10",
  "httpx>=0.27",
  "PyMuPDF>=1.24",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["backend*", "rag_engine*", "ingestion*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
